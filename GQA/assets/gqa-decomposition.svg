      .heading { font-size: 23px; font-weight: 700; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; font-size: 20px; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
