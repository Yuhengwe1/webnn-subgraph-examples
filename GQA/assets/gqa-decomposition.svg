<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">GQA subgraph decomposition</title>
  <desc id="desc">Q and K pass through optional ROPE. Q goes to attention; K and V update the caches. Updated caches are returned before KV heads are repeated. The attention core computes softmax(s Q K transpose + M) V, where s is the scale and M is the causal mask.</desc>
